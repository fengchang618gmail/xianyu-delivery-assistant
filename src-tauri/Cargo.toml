[package]
name = "xianyu-delivery-assistant"
version = "0.1.0"
edition = "2021"

[lib]
name = "xda_core"
path = "src/lib.rs"

[[bin]]
name = "xianyu-delivery-assistant"
path = "src/main.rs"

[[bin]]
name = "nmhost"
path = "src/bin/nmhost.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
keyring = { version = "3", features = ["windows-native"] }
winreg = "0.52"
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["net", "io-util", "rt-multi-thread", "sync", "time", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
rand = "0.8"

# 用纯 cargo build 出生产包时必须启用，否则 Tauri 按 dev 模式编译，
# 运行时去连 devUrl(localhost:5173) 而不是加载内嵌的 frontendDist。
# （tauri CLI 构建会自动附带；这里显式声明供 cargo 直接使用）
[features]
custom-protocol = ["tauri/custom-protocol"]

# 本机仅 8GB 内存：禁用 fat LTO（最终链接需 4-8GB），只保留符号剥离。
[profile.release]
strip = true
